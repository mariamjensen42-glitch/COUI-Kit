name: 部署文档站点

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - Pages/**
      - coui-icons/src/main/res/**
      - coui/src/main/java/com/itos/coui/theme/CouiColor.kt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档与图标站点
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: 安装 Zensical
        run: pip install zensical==0.1.1

      - name: 对齐站点地址
        run: |
          set -euo pipefail
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|^site_url = .*|site_url = \"$base\"|" zensical.toml
          sed -i "s|https://itoseo.github.io/COUI-Kit/|$base|g" zensical.toml
          grep -n "^site_url" zensical.toml

      - name: 构建文档站点
        run: |
          set -euo pipefail
          zensical build --clean
          test -s site/index.html
          test -s site/search.json

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 安装图标网页生成依赖
        run: npm ci --prefix Pages

      - name: 生成图标数据文件
        run: |
          set -euo pipefail
          node Pages/generate.mjs
          test -s Pages/data.js

      - name: 合并图标站点到 /icons
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cp -r Pages/. site/icons/
          rm -rf site/icons/node_modules site/icons/generate.mjs site/icons/package.json \
            site/icons/package-lock.json site/icons/GENERATION.md site/icons/README.md
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|https://itoseo.github.io/COUI-Kit/|$base|g" site/icons/index.html site/icons/icons/index.html
          test -s site/icons/index.html
          test -s site/icons/icons/index.html
          test -s site/icons/data.js

      - name: 上传静态站点产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
