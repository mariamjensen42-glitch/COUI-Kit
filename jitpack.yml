# JitPack 构建配置。
#
# JitPack 用 Tag 或分支名作为版本号，这里传给 VERSION_NAME；
# group 覆盖成 com.github.<用户>.<仓库>，这是 JitPack 多模块项目的坐标约定，
# 同时避免和 Maven Central 的 io.github.itoseo 撞车。
#
# 接入方式：
#   maven { url = uri("https://jitpack.io") }
#   implementation("com.github.mariamjensen42-glitch.COUI-Kit:coui:<tag>")
#   implementation("com.github.mariamjensen42-glitch.COUI-Kit:coui-icons:<tag>")
jdk:
  - openjdk21

install:
  - ./gradlew :coui:publishToMavenLocal :coui-icons:publishToMavenLocal
    -PGROUP=com.github.mariamjensen42-glitch.COUI-Kit
    -PVERSION_NAME=$VERSION
    --no-daemon
